services:
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: sandbox-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}"
      - "plugins.security.disabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: sandbox-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      opensearch.username: "admin"
      opensearch.password: "${OPENSEARCH_ADMIN_PASSWORD}"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - sandbox-net

  data-prepper:
    image: opensearchproject/data-prepper:2.16.0
    container_name: sandbox-data-prepper
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml
      - ./log-generator/output:/usr/share/data-prepper/logs
    ports:
      - "4900:4900"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - sandbox-net

networks:
  sandbox-net:
    driver: bridge

volumes:
  opensearch-data:
